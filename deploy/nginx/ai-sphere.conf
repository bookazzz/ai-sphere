limit_req_zone $binary_remote_addr zone=aisphere_admin:10m rate=2r/s;

server {
    listen 80;
    server_name ai-sphere.ru www.ai-sphere.ru;
    return 301 https://ai-sphere.ru$request_uri;
}

server {
    listen 443 ssl http2;
    # The installed certificate must include both ai-sphere.ru and www.ai-sphere.ru.
    server_name ai-sphere.ru www.ai-sphere.ru;
    root /var/www/ai-sphere/out;
    index index.html;

    if ($host = www.ai-sphere.ru) {
        return 301 https://ai-sphere.ru$request_uri;
    }

    location /api/admin/ {
        limit_req zone=aisphere_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location ~ ^/(admin|callback|works|projects)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-cache, no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* ^/_next/static/.+\.(?:js|css|woff2?|png|jpe?g|webp|avif|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache, no-store" always;
        try_files $uri =404;
    }

    # Consolidated search intents: preserve old addresses with permanent redirects.
    location = /blog/guides/ai-dlya-programmirovaniya-2026/ { return 301 /nejroset-dlya-koda/; }
    location = /blog/guides/ai-dlya-programmirovaniya-luchshie-neyroseti-dlya-koda-2026/ { return 301 /nejroset-dlya-koda/; }
    location = /blog/guides/nejroset-dlya-dokumentov-pdf-excel-word-2026/ { return 301 /nejroset-dlya-dokumentov/; }
    location = /blog/guides/nejroset-dlya-raboty-s-dokumentami-pdf-excel-word/ { return 301 /nejroset-dlya-dokumentov/; }
    location = /blog/guides/chatgpt-rossii-polnyj-gajd-modelyam-openai/ { return 301 /blog/guides/chatgpt-v-rossii-kak-polzovatsya-2026/; }
    location = /blog/guides/chatgpt-v-rossii-bez-vpn-2026/ { return 301 /blog/guides/chatgpt-v-rossii-kak-polzovatsya-2026/; }
    location = /blog/guides/chatgpt-v-rossii-kak-polzovatsya/ { return 301 /blog/guides/chatgpt-v-rossii-kak-polzovatsya-2026/; }
    location = /blog/guides/chatgpt-v-rossii-polnyj-gajd-po-modelyam-openai-2026/ { return 301 /blog/guides/chatgpt-v-rossii-kak-polzovatsya-2026/; }
    location = /blog/guides/kak-polzovatsya-chatgpt-v-rossii/ { return 301 /blog/guides/chatgpt-v-rossii-kak-polzovatsya-2026/; }
    location = /chat-gpt-rossiya/ { return 301 /blog/guides/chatgpt-v-rossii-kak-polzovatsya-2026/; }
    location = /blog/guides/chto-takoe-nejroseti/ { return 301 /blog/guides/chto-takoe-nejroset-i-kak-ona-rabotaet/; }

    location ~ ^/(sitemap\.xml|sitemap-news\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
